<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#glowGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  
  <!-- Image Frame -->
  <rect x="100" y="110" width="312" height="230" rx="24" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="16"/>
  
  <!-- Sun / Sparkle -->
  <circle cx="170" cy="180" r="28" fill="#fef08a"/>
  
  <!-- Mountain landscape -->
  <path d="M116 324 L220 220 L290 280 L350 210 L400 280 L400 324 Z" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Compression Arrows / Badge -->
  <circle cx="360" cy="360" r="70" fill="#10b981" stroke="#ffffff" stroke-width="12"/>
  <path d="M330 360 L390 360 M370 340 L390 360 L370 380" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
